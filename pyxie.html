<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pyxie — Pet Calisthenics</title>
<meta name="description" content="A retro pixel-art calisthenics pet. Train daily to evolve your creature through five stages.">
<meta name="theme-color" content="#0a0418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pyxie">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0a0418;
    --bg-mid: #150a30;
    --bg-card: #1c0f3e;
    --bg-screen: #0d1b2a;
    --border: #4a2a8a;
    --border-bright: #7df9ff;
    --text: #fef6e4;
    --text-dim: #b1a0d8;
    --text-faint: #6b5b95;
    --coral: #ff7f50;
    --gold: #ffd866;
    --cyan: #7df9ff;
    --magenta: #ff77c6;
    --green: #7fff7f;
    --red: #ff5577;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 0%, #2a1560 0%, #0a0418 60%);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
    overscroll-behavior: none;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(1px 1px at 12% 18%, #fff, transparent),
      radial-gradient(1px 1px at 78% 22%, #ffd866, transparent),
      radial-gradient(1px 1px at 33% 64%, #7df9ff, transparent),
      radial-gradient(1px 1px at 89% 81%, #fff, transparent),
      radial-gradient(1px 1px at 55% 45%, #ff77c6, transparent),
      radial-gradient(1px 1px at 8% 91%, #fff, transparent),
      radial-gradient(1px 1px at 64% 12%, #fff, transparent),
      radial-gradient(1px 1px at 22% 38%, #7df9ff, transparent);
    background-size: 100% 100%;
    pointer-events: none;
    animation: twinkle 6s ease-in-out infinite;
    z-index: 0;
  }
  @keyframes twinkle {
    0%,100% { opacity: 0.4; } 50% { opacity: 1; }
  }
  .app {
    max-width: 480px; margin: 0 auto;
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
    padding: 14px 14px 90px;
    position: relative; z-index: 1;
  }
  .title {
    font-family: 'Pixelify Sans', sans-serif;
    font-weight: 700;
    font-size: 1.6rem;
    letter-spacing: 0.04em;
    text-align: center;
    color: var(--gold);
    text-shadow: 0 0 12px rgba(255,216,102,0.4), 2px 2px 0 #5a1a8a;
    margin-bottom: 6px;
  }
  .subtitle {
    text-align: center;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.3em;
    color: var(--text-faint);
    margin-bottom: 14px;
  }
  /* === STATS HUD === */
  .stats-bar {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
  }
  .stat {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    position: relative;
    overflow: hidden;
  }
  .stat-label {
    font-family: 'Pixelify Sans', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    display: flex; justify-content: space-between;
    text-transform: uppercase;
  }
  .stat-bar {
    margin-top: 4px;
    height: 6px;
    background: #0a0418;
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid #2a1560;
  }
  .stat-fill {
    height: 100%;
    transition: width 0.5s ease;
    background: linear-gradient(90deg, var(--green), var(--cyan));
  }
  .stat.hunger .stat-fill { background: linear-gradient(90deg, var(--coral), var(--gold)); }
  .stat.energy .stat-fill { background: linear-gradient(90deg, var(--cyan), var(--magenta)); }
  .stat-low .stat-fill { background: linear-gradient(90deg, var(--red), var(--coral)) !important; }

  /* === MAIN SCREEN === */
  .screen {
    background: linear-gradient(180deg, #0a1428 0%, #0d1b2a 100%);
    border: 2px solid var(--border);
    box-shadow:
      0 0 0 4px var(--bg-card),
      0 0 24px rgba(125,249,255,0.15),
      inset 0 0 60px rgba(125,249,255,0.05);
    border-radius: 14px;
    padding: 18px;
    flex: 1;
    display: flex; flex-direction: column;
    min-height: 380px;
    position: relative;
    overflow: hidden;
  }
  .screen::before {
    content: '';
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.06) 0, rgba(0,0,0,0.06) 1px, transparent 1px, transparent 3px);
    pointer-events: none;
  }
  .screen-inner {
    position: relative; z-index: 1;
    flex: 1;
    display: flex; flex-direction: column;
  }
  /* === PET VIEW === */
  .pet-stage-label {
    font-family: 'Pixelify Sans', sans-serif;
    font-size: 0.6rem; letter-spacing: 0.2em;
    color: var(--cyan);
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 2px;
  }
  .pet-name {
    font-family: 'Pixelify Sans', sans-serif;
    font-size: 1.4rem;
    text-align: center;
    color: var(--text);
    text-shadow: 0 0 8px rgba(255,255,255,0.3);
    margin-bottom: 8px;
  }
  .pet-display {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    min-height: 220px;
  }
  .pet-platform {
    position: absolute; bottom: 4px; left: 50%;
    transform: translateX(-50%);
    width: 70%; height: 18px;
    background: radial-gradient(ellipse at center, rgba(125,249,255,0.4) 0%, transparent 70%);
    filter: blur(2px);
  }
  .pet-sprite {
    width: 200px; height: 200px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    animation: bob 2.4s ease-in-out infinite;
    cursor: pointer;
    filter: drop-shadow(0 0 20px rgba(125,249,255,0.3));
  }
  @keyframes bob {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .pet-sprite:active { animation: squish 0.3s ease; }
  @keyframes squish {
    50% { transform: scale(1.08, 0.92); }
  }
  .pet-mood {
    text-align: center;
    font-size: 0.75rem;
    color: var(--text-dim);
    font-style: italic;
    margin-top: 6px;
    min-height: 18px;
  }
  .pet-actions {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
  }
  /* === BUTTONS === */
  .btn {
    background: var(--bg-card);
    border: 2px solid var(--border);
    color: var(--text);
    font-family: 'Pixelify Sans', sans-serif;
    font-size: 0.9rem;
    letter-spacing: 0.05em;
    padding: 11px 14px;
    border-radius: 8px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.15s;
    position: relative;
    box-shadow: 0 3px 0 #0a0418;
  }
  .btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #0a0418;
  }
  .btn.primary {
    background: linear-gradient(180deg, #ff9a5a, var(--coral));
    border-color: #ff5a1f;
    color: #2a0d00;
    text-shadow: 0 1px 0 rgba(255,255,255,0.3);
  }
  .btn.cyan {
    background: linear-gradient(180deg, #9efdff, var(--cyan));
    border-color: #3aafd0;
    color: #002a3a;
  }
  .btn.gold {
    background: linear-gradient(180deg, #ffe488, var(--gold));
    border-color: #c79b00;
    color: #3a2900;
  }
  .btn.ghost {
    background: transparent;
    border-color: var(--border);
    color: var(--text-dim);
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: 0 3px 0 #0a0418; }
  /* === TAB NAV === */
  .nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: linear-gradient(180deg, transparent, #0a0418 30%);
    padding: 14px 14px 18px;
    z-index: 10;
  }
  .nav-inner {
    max-width: 480px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
    background: var(--bg-card);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    box-shadow: 0 4px 0 #0a0418;
  }
  .nav-btn {
    background: transparent;
    border: none;
    color: var(--text-faint);
    font-family: 'Pixelify Sans', sans-serif;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 10px 6px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .nav-btn.active {
    background: linear-gradient(180deg, #2a1560, #1a0f3a);
    color: var(--gold);
    box-shadow: inset 0 0 0 1px var(--border-bright);
  }
  /* === WORKOUT VIEW === */
  .panel-title {
    font-family: 'Pixelify Sans', sans-serif;
    font-size: 1.2rem;
    color: var(--gold);
    margin-bottom: 4px;
    text-align: center;
  }
  .panel-sub {
    text-align: center;
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-bottom: 16px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .field {
    margin-bottom: 14px;
  }
  .field-label {
    font-family: 'Pixelify Sans', sans-serif;
    font-size: 0.75rem;
    color: var(--cyan);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .seg {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .seg-btn {
    background: var(--bg-deep);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'Pixelify Sans', sans-serif;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 9px 4px;
    border-radius: 6px;
    cursor: pointer;
  }
  .seg-btn.on {
    background: linear-gradient(180deg, var(--coral), #c44820);
    color: #fef6e4;
    border-color: var(--gold);
    box-shadow: 0 0 12px rgba(255,127,80,0.4);
  }
  /* === TIMER === */
  .timer-wrap {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px;
  }
  .timer-phase {
    font-family: 'Pixelify Sans', sans-serif;
    font-size: 0.8rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--cyan);
  }
  .timer-exercise {
    font-family: 'Pixelify Sans', sans-serif;
    font-size: 1.5rem;
    color: var(--text);
    text-align: center;
    padding: 0 8px;
    text-shadow: 0 0 10px rgba(255,255,255,0.3);
  }
  .timer-detail {
    font-size: 0.75rem;
    color: var(--text-dim);
    text-align: center;
    padding: 0 12px;
    line-height: 1.5;
    max-width: 320px;
  }
  .timer-circle {
    position: relative;
    width: 180px; height: 180px;
    display: flex; align-items: center; justify-content: center;
    margin: 8px 0;
  }
  .timer-circle svg { transform: rotate(-90deg); }
  .timer-circle circle { fill: none; stroke-width: 8; }
  .timer-circle .track { stroke: var(--bg-card); }
  .timer-circle .progress {
    stroke: var(--coral);
    stroke-linecap: round;
    transition: stroke-dashoffset 0.5s linear;
    filter: drop-shadow(0 0 6px var(--coral));
  }
  .timer-circle.rest .progress { stroke: var(--cyan); filter: drop-shadow(0 0 6px var(--cyan)); }
  .timer-time {
    position: absolute;
    font-family: 'Pixelify Sans', sans-serif;
    font-size: 2.6rem;
    color: var(--text);
  }
  .timer-next {
    font-size: 0.7rem;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }
  .timer-actions {
    display: flex; gap: 8px; margin-top: 4px;
  }
  /* === SETTINGS === */
  .row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid rgba(74,42,138,0.4);
  }
  .row:last-child { border-bottom: none; }
  .row-label { font-size: 0.85rem; color: var(--text); }
  .row-sub { font-size: 0.7rem; color: var(--text-faint); margin-top: 2px; }
  .time-input {
    display: flex; align-items: center; gap: 4px;
    background: var(--bg-deep);
    border: 1px solid var(--border);
    padding: 6px 10px;
    border-radius: 6px;
  }
  .time-input input {
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'Pixelify Sans', sans-serif;
    font-size: 1.1rem;
    width: 32px;
    text-align: center;
    outline: none;
  }
  .toggle {
    width: 44px; height: 24px;
    background: var(--bg-deep);
    border: 1px solid var(--border);
    border-radius: 12px;
    position: relative;
    cursor: pointer;
    transition: all 0.2s;
  }
  .toggle::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 18px; height: 18px;
    background: var(--text-dim);
    border-radius: 50%;
    transition: all 0.2s;
  }
  .toggle.on {
    background: linear-gradient(180deg, var(--green), #3a9a3a);
    border-color: var(--green);
  }
  .toggle.on::after {
    left: 22px;
    background: #fff;
  }
  /* === STARTER SELECT === */
  .starter-grid {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin: 10px 0;
  }
  .starter-card {
    background: var(--bg-deep);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 6px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
  }
  .starter-card.selected {
    border-color: var(--gold);
    background: var(--bg-card);
    box-shadow: 0 0 16px rgba(255,216,102,0.3);
  }
  .starter-card svg {
    width: 80px; height: 80px;
    image-rendering: pixelated;
    margin: 0 auto;
    display: block;
  }
  .starter-name {
    font-family: 'Pixelify Sans', sans-serif;
    font-size: 0.85rem;
    color: var(--text);
    margin-top: 4px;
  }
  .starter-type {
    font-size: 0.6rem;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }
  /* === DEAD/MISC === */
  .meta-line {
    display: flex; justify-content: center; gap: 14px;
    font-size: 0.7rem; color: var(--text-faint);
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .meta-line span b { color: var(--gold); font-weight: normal; }
  input[type="text"] {
    width: 100%;
    background: var(--bg-deep);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Pixelify Sans', sans-serif;
    font-size: 1rem;
    padding: 10px;
    border-radius: 6px;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--cyan); }
  .hint {
    background: rgba(125,249,255,0.06);
    border-left: 2px solid var(--cyan);
    padding: 8px 10px;
    font-size: 0.72rem;
    color: var(--text-dim);
    border-radius: 4px;
    line-height: 1.5;
    margin: 10px 0;
  }
  .evo-flash {
    position: fixed; inset: 0;
    background: radial-gradient(circle, rgba(255,216,102,0.95), rgba(255,127,80,0.8) 40%, rgba(10,4,24,0.95));
    z-index: 100;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    animation: flash 3s ease forwards;
  }
  @keyframes flash {
    0% { opacity: 0; }
    20%,80% { opacity: 1; }
    100% { opacity: 0; pointer-events: none; }
  }
  .evo-text {
    font-family: 'Pixelify Sans', sans-serif;
    font-size: 2rem;
    color: #fff;
    text-shadow: 0 0 20px var(--gold), 4px 4px 0 #5a1a8a;
    margin-top: 18px;
    animation: pop 1.2s ease;
  }
  @keyframes pop {
    0% { transform: scale(0.6); opacity: 0; }
    60% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .evo-flash svg { width: 220px; height: 220px; animation: spin-in 1.4s ease; }
  @keyframes spin-in {
    from { transform: rotate(-180deg) scale(0); }
    to { transform: rotate(0) scale(1); }
  }
  .history-item {
    display: flex; justify-content: space-between;
    padding: 6px 0;
    font-size: 0.75rem;
    color: var(--text-dim);
    border-bottom: 1px dashed rgba(74,42,138,0.3);
  }
  .history-item:last-child { border: none; }
  .history-item b { color: var(--gold); font-weight: normal; }
  /* === INSTALL NUDGE === */
  .install-modal {
    position: fixed; inset: 0;
    background: rgba(10,4,24,0.85);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    padding: 20px;
    animation: install-fade-in 0.25s ease;
  }
  .install-modal-card {
    background: var(--bg-card);
    border: 2px solid var(--border-bright);
    border-radius: 14px;
    padding: 22px;
    max-width: 360px; width: 100%;
    text-align: center;
    box-shadow: 0 0 32px rgba(125,249,255,0.2);
  }
  .install-modal-title {
    font-family: 'Pixelify Sans', sans-serif;
    font-size: 1.3rem;
    color: var(--gold);
    margin-bottom: 10px;
    letter-spacing: 0.05em;
  }
  .install-modal-body {
    font-size: 0.85rem;
    color: var(--text-dim);
    line-height: 1.6;
    margin-bottom: 18px;
  }
  .install-modal-body b { color: var(--cyan); font-weight: normal; }
  .install-row { margin-top: 18px; }
  @keyframes install-fade-in { from { opacity: 0; } to { opacity: 1; } }
  @media (display-mode: standalone) {
    .install-modal, .install-row { display: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="title">PYXIE</div>
  <div class="subtitle">Pixel Pet · Calisthenics</div>
  <div id="hud"></div>
  <div class="screen"><div class="screen-inner" id="screen"></div></div>
</div>
<nav class="nav"><div class="nav-inner" id="nav"></div></nav>

<script>
/* =========================================================
   PYXIE — A pixel-pet calisthenics companion
   ========================================================= */

/* ---------- CREATURE DEFINITIONS ----------
   Each creature is a 16x16 pixel grid using palette characters.
   '.' = transparent, '1'-'9','a'-'z' = palette index
   --------------------------------------- */

const PALETTES = {
  ember: ['#ff4422','#ff8844','#ffcc66','#aa1100','#ffee99','#5a0d00','#ffffff','#1a0a0a'],
  tide:  ['#3366cc','#5599ee','#88ccff','#1a3380','#ccf2ff','#0a1a4a','#ffffff','#0a0a1a'],
  verdant:['#3aaa45','#66dd55','#bbee88','#1a6622','#e8ffcc','#4a3320','#ffffff','#0a1a0a'],
};

/* Each grid is 16 lines of 16 chars. Drawn top-to-bottom.
   The digit 1-6 indexes the palette: 1=primary 2=mid 3=light 4=dark 5=highlight 6=accent.
   '7' = white (eye), '8' = black (pupil). Same palette table mapping for all. */

const CREATURES = {
  ember: [
    { // 1 — EMBERLING (small flame sprite)
      name: 'Emberling', stage: 1,
      grid: [
        '................',
        '................',
        '................',
        '.......32.......',
        '......3221......',
        '.....322321.....',
        '....32263321....',
        '....32263321....',
        '....32213321....',
        '....37822321....',
        '....32183321....',
        '....32213321....',
        '.....322321.....',
        '......32221.....',
        '................',
        '................',
      ]
    },
    { // 2 — CINDERPUP (fire puppy)
      name: 'Cinderpup', stage: 2,
      grid: [
        '................',
        '....3......3....',
        '....32....32....',
        '...3322..3322...',
        '..332222222233..',
        '.3322112222233..',
        '.32211122222233.',
        '.32178121782233.',
        '.32188121882233.',
        '.32211122122233.',
        '.32221112222433.',
        '.322221122224.3.',
        '..3222112224.3..',
        '...33.4..44.3...',
        '................',
        '................',
      ]
    },
    { // 3 — PYROKIT (fox cub)
      name: 'Pyrokit', stage: 3,
      grid: [
        '................',
        '..3..........3..',
        '..32........32..',
        '..322......322..',
        '..3221....1223..',
        '..3211211112233.',
        '.32211711712223.',
        '.32211871872223.',
        '.32211112112223.',
        '.322211511122233',
        '.3222115551223.3',
        '.32222115122.3.3',
        '.32222112224..3.',
        '..3222122244..3.',
        '...4444..44.....',
        '................',

/* ---------- RENDER CREATURE TO SVG ---------- */
function creatureSVG(line, stageIdx, size=200) {
  const def = CREATURES[line][stageIdx];
  const palette = PALETTES[line];
  const cell = size / 16;
  let rects = '';
  for (let y = 0; y < 16; y++) {
    for (let x = 0; x < 16; x++) {
      const ch = def.grid[y][x];
      if (ch === '.') continue;
      let color;
      if (ch === '7') color = '#ffffff';
      else if (ch === '8') color = '#0a0a0a';
      else if (ch === '9') color = palette[7] || '#000';
      else {
        const idx = parseInt(ch, 10) - 1;
        color = palette[idx] || '#888';
      }
      rects += `<rect x="${x*cell}" y="${y*cell}" width="${cell+0.5}" height="${cell+0.5}" fill="${color}"/>`;
    }
  }
  return `<svg class="pet-sprite" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">${rects}</svg>`;
}

/* ---------- STORAGE ---------- */
async function loadState() {
  try {
    const result = await window.storage.get('pyxie-state');
    if (result && result.value) {
      const loaded = JSON.parse(result.value);
      state = { ...JSON.parse(JSON.stringify(DEFAULT_STATE)), ...loaded };
      state.settings = { ...DEFAULT_STATE.settings, ...(loaded.settings||{}) };
    }
  } catch(e) { /* no key yet */ }
}
async function saveState() {
  try {
    const toSave = {
      pet: state.pet,
      settings: state.settings,
      history: state.history,
      installNudgeDismissed: !!state.installNudgeDismissed,
      ui: { tab: state.ui.tab || 'pet' },
    };
    await window.storage.set('pyxie-state', JSON.stringify(toSave));
  } catch(e) { console.warn('Save failed', e); }
}

/* ===== INSTALL HELPERS (pure, testable) ===== */
function isStandaloneDisplay(matchMedia, navigatorStandalone) {
  const mm = !!(matchMedia && matchMedia('(display-mode: standalone)').matches);
  return mm || navigatorStandalone === true;
}
function isIOSSafariUA(ua) {
  const isIOS = /iPad|iPhone|iPod/.test(ua);
  const isSafari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS/.test(ua);
  return isIOS && isSafari;
}
function shouldShowFirstRunNudge(historyLength, dismissed, isInstalled) {
  return historyLength === 3 && !dismissed && !isInstalled;
}
/* ===== END INSTALL HELPERS ===== */

let installState = { deferredPrompt: null };

function isInstalled() {
  return isStandaloneDisplay(window.matchMedia.bind(window), navigator.standalone);
}

function initInstallNudge() {
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    installState.deferredPrompt = e;
    if (state.ui && state.ui.tab === 'settings') render();
  });
  window.addEventListener('appinstalled', () => {

/* ---------- DECAY ---------- */
function applyDecay() {
  if (!state.pet || !state.pet.alive) return;
  const now = Date.now();
  const last = state.pet.lastDecay || now;
  const hours = Math.max(0, (now - last) / (1000 * 60 * 60));
  if (hours < 0.5) return;
  // Decay rates per hour
  const hungerLoss = hours * 1.6;
  const happyLoss  = hours * 1.2;
  const energyLoss = hours * 1.0;
  state.pet.hunger    = Math.max(0, state.pet.hunger - hungerLoss);
  state.pet.happiness = Math.max(0, state.pet.happiness - happyLoss);
  state.pet.energy    = Math.max(0, state.pet.energy - energyLoss);
  state.pet.lastDecay = now;
  // Streak check
  if (state.pet.lastWorkout) {
    const days = Math.floor((now - state.pet.lastWorkout) / (1000*60*60*24));
    if (days > 1) state.pet.streak = 0;
  }
  // Death check: if hunger AND happiness both 0 for too long
  if (state.pet.hunger <= 0 && state.pet.happiness <= 0) {
    const criticalSince = state.pet.criticalSince || now;
    state.pet.criticalSince = criticalSince;
    if (now - criticalSince > 1000 * 60 * 60 * 24 * 2) { // 2 days fully starved
      state.pet.alive = false;
    }
  } else {
    state.pet.criticalSince = null;
  }
}

/* ---------- MOOD ---------- */
function petMood() {
  const p = state.pet;
  if (!p) return '';
  const avg = (p.hunger + p.happiness + p.energy) / 3;
  if (avg < 15) return pick(MOODS.weak);
  if (p.hunger < 30) return pick(MOODS.hungry);
  if (p.happiness < 30) return pick(MOODS.sad);
  if (p.energy < 30) return pick(MOODS.tired);
  if (avg > 75) return pick(MOODS.great);
  return pick(MOODS.ok);
}
function pick(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

    <div class="panel-title">Choose your companion</div>
    <div class="panel-sub">An egg from one of three realms</div>
    <div class="starter-grid">
      ${choices.map(line => `
        <div class="starter-card ${selected===line?'selected':''}" data-line="${line}">
          ${creatureSVG(line, 0, 80)}
          <div class="starter-name">${CREATURES[line][0].name}</div>
          <div class="starter-type">${LINE_INFO[line].label}</div>
        </div>
      `).join('')}
    </div>
    <div class="hint">${LINE_INFO[selected].tagline}. Your pet will evolve through 5 stages as you complete daily workouts.</div>
    <div class="field">
      <div class="field-label">Name your pet</div>
      <input type="text" id="petName" placeholder="${CREATURES[selected][0].name}" value="${name}" maxlength="14">
    </div>
    <button class="btn primary" id="hatchBtn">Begin the journey</button>
  `;
  $('screen').querySelectorAll('.starter-card').forEach(c => {
    c.onclick = () => { state.ui._starterPick = c.dataset.line; render(); };
  });
  $('petName').oninput = e => state.ui._starterName = e.target.value;
  $('hatchBtn').onclick = () => {
    const line = state.ui._starterPick || 'ember';
    const n = (state.ui._starterName || '').trim() || CREATURES[line][0].name;
    state.pet = {
      name: n, line, stage: 0,
      hunger: 80, happiness: 90, energy: 80,
      xp: 0, streak: 0, alive: true,
      born: Date.now(),
      lastDecay: Date.now(),
      lastWorkout: null,
    };
    state.ui._starterPick = null;
    state.ui._starterName = null;
    state.ui.tab = 'pet';
    saveState();
    render();
  };
}

function viewPet() {
  const p = state.pet;
  const creature = CREATURES[p.line][p.stage];
  const next = CREATURES[p.line][p.stage+1];
  const lineInfo = LINE_INFO[p.line];
  const nextThreshold = XP_THRESHOLDS[p.stage+1];
  const xpToNext = nextThreshold ? Math.max(0, nextThreshold - p.xp) : 0;

  $('screen').innerHTML = `
    <div class="pet-stage-label">Stage ${p.stage+1} of 5 · ${lineInfo.label}</div>
    <div class="pet-name">${p.name}</div>
    <div class="pet-display">
      <div class="pet-platform"></div>
      ${creatureSVG(p.line, p.stage, 200)}
    </div>
    <div class="pet-mood">${petMood()}</div>
    <div class="meta-line">
      <span>Streak <b>${p.streak}d</b></span>
      <span>XP <b>${p.xp}</b></span>
      ${next ? `<span>Next <b>${xpToNext} XP</b></span>` : `<span><b>Final form</b></span>`}
    </div>
    <div class="pet-actions">
      <button class="btn cyan" id="petPlay">Play</button>
      <button class="btn primary" id="petWorkout">Workout</button>
    </div>
  `;

  document.querySelector('.pet-sprite').onclick = () => {
    state.pet.happiness = Math.min(100, state.pet.happiness + 2);
    saveState();
    renderHUD();
  };
  $('petPlay').onclick = () => {
    state.pet.happiness = Math.min(100, state.pet.happiness + 12);
    state.pet.energy = Math.max(0, state.pet.energy - 4);
    saveState();
    render();
  };
  $('petWorkout').onclick = () => { state.ui.tab = 'workout'; render(); };
}

function viewWorkout() {
  const s = state.settings;
  if (state.ui._workoutActive) { renderWorkoutTimer(); return; }
  $('screen').innerHTML = `
    <div class="panel-title">Daily Workout</div>
    <div class="panel-sub">10 minutes · 8 exercises</div>
    <div class="field">
      <div class="field-label">Intensity</div>
      <div class="seg" id="segIntensity">
        ${['easy','medium','hard'].map(v => `<button class="seg-btn ${s.intensity===v?'on':''}" data-v="${v}">${v}</button>`).join('')}
      </div>
    </div>
    <div class="field">
      <div class="field-label">Complexity</div>
      <div class="seg" id="segComplexity">
        ${['beginner','intermediate','advanced'].map(v => `<button class="seg-btn ${s.complexity===v?'on':''}" data-v="${v}">${v}</button>`).join('')}
      </div>
    </div>
    <div class="hint">Format: 60s warmup → 8 exercises (45s work / 15s rest) → 60s cooldown. Tap "Start" to lock in a fresh randomized session.</div>
    <div id="preview"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;">
      <button class="btn ghost" id="rerollBtn">Reroll</button>
      <button class="btn primary" id="startBtn">Start</button>
    </div>
  `;
  $('segIntensity').querySelectorAll('.seg-btn').forEach(b => {
    b.onclick = () => { state.settings.intensity = b.dataset.v; saveState(); render(); };
  });
  $('segComplexity').querySelectorAll('.seg-btn').forEach(b => {
    b.onclick = () => { state.settings.complexity = b.dataset.v; saveState(); render(); };
  });

  function buildPreview() {
    if (!state.ui._previewList) {
      state.ui._previewList = pickExercises(s.intensity, s.complexity, 8);
    }
    $('preview').innerHTML = `
      <div class="field-label" style="margin-top:8px;">Today's set</div>
      ${state.ui._previewList.map((e,i)=>`
        <div class="history-item"><span>${i+1}. ${e.name}</span><span>45s</span></div>
      `).join('')}
    `;
  }
  buildPreview();

  $('rerollBtn').onclick = () => {
    state.ui._previewList = pickExercises(s.intensity, s.complexity, 8);
    buildPreview();
  };
  $('startBtn').onclick = () => {
    startWorkout(state.ui._previewList);
  };
}

function pickExercises(intensity, complexity, count) {
  const pool = [...(EXERCISES[intensity]?.[complexity] || EXERCISES.medium.beginner)];
  // Fisher-Yates shuffle
  for (let i = pool.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, count);
}

/* ---------- WORKOUT TIMER ---------- */
let workoutTick = null;

function startWorkout(exList) {
  // Resume / create audio context now (user gesture)
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch(e) {}
  // Segments: warmup, then for each exercise: work + rest, then cooldown
  const segments = [{ kind: 'warmup', dur: 60, label: 'Warm up' }];
  exList.forEach((ex, i) => {
    segments.push({ kind: 'work', dur: 45, label: ex.name, cue: ex.cue, idx: i+1 });
    if (i < exList.length-1) segments.push({ kind: 'rest', dur: 15, label: 'Rest', next: exList[i+1].name });
  });
  segments.push({ kind: 'cooldown', dur: 60, label: 'Cool down' });

  state.ui._workoutActive = {
    segments,
    segIdx: 0,
    remaining: segments[0].dur,
    paused: false,
    startedAt: Date.now(),
    exList,
    intensity: state.settings.intensity,
    complexity: state.settings.complexity,
  };
  if (workoutTick) clearInterval(workoutTick);
  workoutTick = setInterval(tickWorkout, 1000);
  render();
}

function tickWorkout() {
  const w = state.ui._workoutActive;
  if (!w || w.paused) return;
  w.remaining -= 1;
  if (w.remaining < 0) {
    // advance
    w.segIdx += 1;
    if (w.segIdx >= w.segments.length) {
      finishWorkout(true);
      return;
    }
    w.remaining = w.segments[w.segIdx].dur;
    beep(w.segments[w.segIdx].kind);
  } else if (w.remaining === 3 || w.remaining === 2 || w.remaining === 1) {
    beep('tick');
  }
  renderWorkoutTimer();
}

function renderWorkoutTimer() {
  const w = state.ui._workoutActive;
  if (!w) return;
  const seg = w.segments[w.segIdx];
  const total = seg.dur;
  const r = Math.max(0, w.remaining);
  const pct = (total - r) / total;
  const dash = 2 * Math.PI * 78;
  const offset = dash * (1 - pct);
  const phaseClass = (seg.kind === 'rest') ? 'rest' : '';
  const mins = String(Math.floor(r/60)).padStart(1,'0');
  const secs = String(r%60).padStart(2,'0');
  const phaseLabel = ({warmup:'Warm Up', work:`Exercise ${seg.idx||''} / ${w.exList.length}`, rest:'Rest', cooldown:'Cool Down'})[seg.kind];
  const nextName = w.segments[w.segIdx+1]?.label;

  $('screen').innerHTML = `
    <div class="timer-wrap">
      <div class="timer-phase">${phaseLabel}</div>
      <div class="timer-exercise">${seg.label}</div>
      ${seg.cue ? `<div class="timer-detail">${seg.cue}</div>` : ''}
      ${seg.kind === 'rest' && seg.next ? `<div class="timer-detail">Next: <b>${seg.next}</b></div>` : ''}
      <div class="timer-circle ${phaseClass}">
        <svg width="180" height="180" viewBox="0 0 180 180">
          <circle class="track" cx="90" cy="90" r="78"/>
          <circle class="progress" cx="90" cy="90" r="78" stroke-dasharray="${dash}" stroke-dashoffset="${offset}"/>
        </svg>
        <div class="timer-time">${mins}:${secs}</div>
      </div>
      <div class="timer-next">${nextName ? 'Up next: '+nextName : 'Final stretch!'}</div>
      <div class="timer-actions">
        <button class="btn ghost" id="pauseBtn">${w.paused ? 'Resume' : 'Pause'}</button>
        <button class="btn ghost" id="skipBtn">Skip</button>
        <button class="btn ghost" id="abortBtn">Quit</button>
      </div>
    </div>
  `;
  $('pauseBtn').onclick = () => { w.paused = !w.paused; renderWorkoutTimer(); };
  $('skipBtn').onclick = () => {
    w.segIdx += 1;
    if (w.segIdx >= w.segments.length) return finishWorkout(true);
    w.remaining = w.segments[w.segIdx].dur;
    renderWorkoutTimer();
  };
  $('abortBtn').onclick = () => finishWorkout(false);
}

function finishWorkout(completed) {
  if (workoutTick) { clearInterval(workoutTick); workoutTick = null; }
  const w = state.ui._workoutActive;
  state.ui._workoutActive = null;
  state.ui._previewList = null;
  if (!w) { render(); return; }

  if (completed && state.pet && state.pet.alive) {
    const xpBase = { easy: 12, medium: 22, hard: 38 }[w.intensity];
    const cxMult = { beginner: 1.0, intermediate: 1.25, advanced: 1.5 }[w.complexity];
    const xpGained = Math.round(xpBase * cxMult);
    state.pet.xp += xpGained;
    state.pet.hunger = Math.min(100, state.pet.hunger + 28);
    state.pet.happiness = Math.min(100, state.pet.happiness + 22);
    state.pet.energy = Math.min(100, state.pet.energy + 18);
    // streak
    const now = Date.now();
    const last = state.pet.lastWorkout;
    if (last) {
      const days = Math.floor((now - last) / (1000*60*60*24));
      if (days === 0) {} // same day, no streak change
      else if (days === 1) state.pet.streak += 1;
      else state.pet.streak = 1;
    } else {
      state.pet.streak = 1;
    }
    state.pet.lastWorkout = now;
    state.history.unshift({
      date: now, intensity: w.intensity, complexity: w.complexity,
      count: w.exList.length, xpGained
    });
    if (state.history.length > 30) state.history.length = 30;

    if (shouldShowFirstRunNudge(state.history.length, state.installNudgeDismissed, isInstalled())
        && isIOSSafariUA(navigator.userAgent)) {
      setTimeout(showIOSInstallModal, 600);
    }

    // Evolution check
    const next = XP_THRESHOLDS[state.pet.stage+1];
    if (next !== undefined && state.pet.xp >= next && state.pet.stage < 4) {
      state.pet.stage += 1;
      triggerEvolution();
    }
  }
  saveState();
  state.ui.tab = 'pet';
  render();
}

function triggerEvolution() {
  const p = state.pet;
  const overlay = document.createElement('div');
  overlay.className = 'evo-flash';
  overlay.innerHTML = `
    ${creatureSVG(p.line, p.stage, 220)}
    <div class="evo-text">${p.name} evolved!</div>
    <div style="color:#fff;font-family:'Pixelify Sans',sans-serif;font-size:0.95rem;margin-top:6px;letter-spacing:0.15em;">
      → ${CREATURES[p.line][p.stage].name.toUpperCase()}
    </div>
  `;
  document.body.appendChild(overlay);
  beep('evolution');
  setTimeout(() => overlay.remove(), 3000);
}

function viewSettings() {
  const s = state.settings;
  $('screen').innerHTML = `
    <div class="panel-title">Settings</div>
    <div class="panel-sub">Configure your routine</div>
    <div class="row">
      <div>
        <div class="row-label">Daily alarm</div>
        <div class="row-sub">Notification when this tab is open</div>
      </div>
      <div class="toggle ${s.alarmEnabled?'on':''}" id="alarmToggle"></div>
    </div>
    <div class="row">
      <div>
        <div class="row-label">Alarm time</div>
        <div class="row-sub">24-hour format</div>
      </div>
      <div class="time-input">
        <input type="text" id="alarmH" value="${String(s.alarmHour).padStart(2,'0')}" maxlength="2">
        <span>:</span>
        <input type="text" id="alarmM" value="${String(s.alarmMinute).padStart(2,'0')}" maxlength="2">
      </div>
    </div>
    <div class="row">
      <div>
        <div class="row-label">Sound effects</div>
        <div class="row-sub">Beeps during workout</div>
      </div>
      <div class="toggle ${s.soundOn?'on':''}" id="soundToggle"></div>
    </div>
    <div style="margin-top:18px;">
      <div class="field-label">Recent workouts</div>
      ${state.history.length === 0 ? '<div class="row-sub" style="padding:8px 0;">No history yet.</div>' :
        state.history.slice(0,6).map(h => {
          const d = new Date(h.date);
          const date = d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
          return `<div class="history-item"><span>${date} · ${h.intensity}/${h.complexity}</span><span>+<b>${h.xpGained}</b> XP</span></div>`;
        }).join('')
      }
    </div>
    ${(installState.deferredPrompt && !isInstalled()) ? `
      <div class="install-row">
        <button class="btn cyan" id="installBtn" style="width:100%;">Install App</button>
        <div class="row-sub" style="text-align:center;margin-top:6px;">Pin Pyxie to your home screen for the full experience.</div>
      </div>
    ` : ''}
    <div style="margin-top:18px;">
      <button class="btn ghost" id="resetBtn">Start over (release pet)</button>
    </div>
    <div class="hint">⚠️ Browser alarms only fire when this tab is open. For real alarms, set a backup on your phone.</div>
  `;
  $('alarmToggle').onclick = () => {
    state.settings.alarmEnabled = !state.settings.alarmEnabled;
    if (state.settings.alarmEnabled) requestNotificationPerm();
    saveState();
    render();
  };
  $('soundToggle').onclick = () => {
    state.settings.soundOn = !state.settings.soundOn;
    saveState();
    render();
  };
  const onTimeChange = () => {
    const h = parseInt($('alarmH').value, 10);
    const m = parseInt($('alarmM').value, 10);
    if (!isNaN(h) && h>=0 && h<24) state.settings.alarmHour = h;
    if (!isNaN(m) && m>=0 && m<60) state.settings.alarmMinute = m;
    saveState();
  };
  $('alarmH').onblur = onTimeChange;
  $('alarmM').onblur = onTimeChange;
  if ($('installBtn')) $('installBtn').onclick = promptInstall;
  $('resetBtn').onclick = () => {
    if (confirm('Really release your pet and start fresh? This cannot be undone.')) {
      state.pet = null;
      state.history = [];
      saveState();
      render();
    }
  };
}

function viewDead() {
  const p = state.pet;
  $('screen').innerHTML = `
    <div class="panel-title" style="color:var(--red);">${p.name} has departed</div>
    <div class="panel-sub">Your companion needed more care</div>
    <div class="pet-display" style="opacity:0.4;filter:grayscale(0.8);">
      ${creatureSVG(p.line, p.stage, 180)}
    </div>
    <div class="hint">${p.name} reached stage ${p.stage+1} of 5 over ${Math.floor((Date.now()-p.born)/(1000*60*60*24))} days, with ${p.xp} total XP earned.</div>
    <button class="btn primary" id="restartBtn">Begin again</button>
  `;
  $('restartBtn').onclick = () => {
    state.pet = null;
    saveState();
    render();
  };
}

/* ---------- ALARM ---------- */
let alarmCheck = null;
async function requestNotificationPerm() {
  if (!('Notification' in window)) return false;
  if (Notification.permission === 'granted') return true;
  if (Notification.permission !== 'denied') {
    const p = await Notification.requestPermission();
    return p === 'granted';
  }
  return false;
}
function startAlarmLoop() {
  if (alarmCheck) clearInterval(alarmCheck);
  alarmCheck = setInterval(() => {
    if (!state.settings.alarmEnabled) return;
    const now = new Date();
    const key = now.toDateString();
    if (now.getHours() === state.settings.alarmHour &&
        now.getMinutes() === state.settings.alarmMinute &&
        state.ui._lastAlarmFired !== key) {
      state.ui._lastAlarmFired = key;
      fireAlarm();
    }
  }, 30 * 1000);
}
function fireAlarm() {
  beep('alarm');
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification('Pyxie wants to train!', {
      body: 'Your daily 10-minute workout is calling.',
      icon: 'data:image/svg+xml;utf8,' + encodeURIComponent(creatureSVG(state.pet?.line||'ember', state.pet?.stage||0, 64))
    });
  }
}

/* ---------- SOUND ---------- */
let audioCtx = null;
function beep(kind) {
  if (!state.settings.soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = audioCtx;
    const now = ctx.currentTime;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.0001, now);
    let freq = 660, dur = 0.12, type = 'square';
    if (kind === 'tick')      { freq = 880; dur = 0.06; }
    else if (kind === 'work') { freq = 660; dur = 0.18; }
    else if (kind === 'rest') { freq = 440; dur = 0.18; }
    else if (kind === 'warmup'){ freq = 520; dur = 0.18; }
    else if (kind === 'cooldown'){ freq = 392; dur = 0.18; }
    else if (kind === 'alarm') {
      // triple beep
      [880, 988, 1100].forEach((f, i) => {
        const oo = ctx.createOscillator(), gg = ctx.createGain();
        oo.connect(gg); gg.connect(ctx.destination);
        oo.type = 'square'; oo.frequency.value = f;
        const t = now + i*0.18;
        gg.gain.setValueAtTime(0.0001, t);
        gg.gain.exponentialRampToValueAtTime(0.18, t+0.01);
        gg.gain.exponentialRampToValueAtTime(0.0001, t+0.15);
        oo.start(t); oo.stop(t+0.18);
      });
      return;
    }
    else if (kind === 'evolution') {
      [523, 659, 784, 1046].forEach((f, i) => {
        const oo = ctx.createOscillator(), gg = ctx.createGain();
        oo.connect(gg); gg.connect(ctx.destination);
        oo.type = 'triangle'; oo.frequency.value = f;
        const t = now + i*0.15;
        gg.gain.setValueAtTime(0.0001, t);
        gg.gain.exponentialRampToValueAtTime(0.22, t+0.02);
        gg.gain.exponentialRampToValueAtTime(0.0001, t+0.28);
        oo.start(t); oo.stop(t+0.3);
      });
      return;
    }
    o.type = type; o.frequency.value = freq;
    g.gain.exponentialRampToValueAtTime(0.16, now + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.start(now); o.stop(now + dur);
  } catch(e) { /* audio blocked */ }
}

/* ---------- MAIN RENDER ---------- */
function render() {
  applyDecay();
  renderHUD();
  renderNav();
  if (!state.pet) return viewHatch();
  if (!state.pet.alive) return viewDead();
  if (state.ui._workoutActive) return renderWorkoutTimer();
  if (state.ui.tab === 'workout') return viewWorkout();
  if (state.ui.tab === 'settings') return viewSettings();
  return viewPet();
}

/* ---------- BOOT ---------- */
(async function init() {
  await loadState();
  initInstallNudge();
  render();
  startAlarmLoop();
  // Save periodically
  setInterval(() => { applyDecay(); saveState(); renderHUD(); }, 60 * 1000);
  // Save on hide
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveState(); });
  window.addEventListener('beforeunload', saveState);
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => { /* offline-only feature; silent on failure */ });
  });
}
</script>
