name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  sprite-parity:
    # ADR-0005 CI parity gate: regenerate the wiki SVG export from the shared
    # renderer and fail the build if the output diverges from what's committed.
    # Eliminates the wiki-drift class of bug.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Verify sprite export matches committed wiki SVGs
        run: npm run verify:sprites
